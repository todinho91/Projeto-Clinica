<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração — Vitalis</title>
    <link rel="icon" type="image/png" href="img/icons8-blue-heart-96.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-heart-pulse-fill"></i>
                Vitalis — <span data-clinic-name>Clínica</span>
            </a>
            <a class="btn btn-outline-light me-2 ms-auto" href="select-clinic.html">Trocar clínica</a>
            <button class="btn btn-outline-light" id="logout-button">Sair</button>
        </div>
    </nav>

    <main class="container mt-5">
        <h1 class="mb-4" id="dashboard-title">Administração da clínica</h1>

        <section class="content-section">
            <h2>Anexar documento clínico</h2>
            <form id="upload-documento-form" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="paciente-id" class="form-label">ID do Paciente:</label>
                    <input type="number" id="paciente-id" name="paciente_id" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="titulo-exame" class="form-label">Título do documento:</label>
                    <input type="text" id="titulo-exame" name="titulo" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="arquivo-exame" class="form-label">Arquivo:</label>
                    <input type="file" id="arquivo-exame" name="documento" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-cloud-arrow-up-fill"></i> Enviar documento
                </button>
                <div id="upload-status" class="mt-3"></div>
            </form>
        </section>

        </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/vitalis-client.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
