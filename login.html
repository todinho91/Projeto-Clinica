<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Clínica Vitalis</title>
    <link rel="icon" type="image/png" href="img/icons8-blue-heart-96.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Estilo específico para centralizar o conteúdo da página de login */
        body, html {
            height: 100%;
        }
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
    </style>
</head>
<body class="bg-light">

    <div class="login-container">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <h2 class="h3"><i class="bi bi-heart-pulse-fill text-primary"></i> Clínica Vitalis</h2>
                        <p class="text-muted">Acesse seu painel</p>
                    </div>

                    <form id="login-form">
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail:</label>
                            <input type="email" class="form-control" id="email" placeholder="seuemail@exemplo.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="senha" class="form-label">Senha:</label>
                            <input type="password" class="form-control" id="senha" required>
                        </div>
                        <div class="d-grid">
                           <button type="submit" class="btn btn-primary">Entrar</button>
                        </div>
                    </form>

                    <div id="error-message" class="mt-3 text-center text-danger"></div>
                    
                    <div class="text-center mt-3">
                        <p class="mb-0">Não tem uma conta? <a href="register.html">Cadastre-se</a></p>
                        <a href="index.html">Voltar para a página inicial</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
