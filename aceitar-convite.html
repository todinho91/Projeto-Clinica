<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aceitar convite — Vitalis</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body class="bg-light"><main class="container py-5" style="max-width:620px"><section class="card border-0 shadow-sm p-4 p-md-5"><p class="text-primary fw-semibold mb-1">Vitalis</p><h1 class="h3">Ativar acesso à clínica</h1><div id="aceite-detalhes" class="alert alert-light mt-3">Validando convite...</div><form id="aceite-form" hidden><div id="aceite-senha-campo"><label class="form-label" for="aceite-senha">Crie sua senha</label><input class="form-control" id="aceite-senha" type="password" minlength="12" maxlength="200" autocomplete="new-password"><div class="form-text">Use pelo menos 12 caracteres. A senha não será enviada por e-mail.</div></div><button class="btn btn-primary w-100 mt-4" type="submit">Aceitar convite</button></form><div id="aceite-status" class="mt-3" role="status" aria-live="polite"></div><a class="mt-3" href="login.html">Ir para o login</a></section></main><script src="js/vitalis-client.js"></script><script src="js/main.js"></script></body></html>
