<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do paciente — Vitalis</title>
    <link rel="icon" type="image/png" href="img/icons8-blue-heart-96.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-heart-pulse-fill"></i>
                Vitalis — <span data-clinic-name>Clínica</span>
            </a>
            <a class="btn btn-outline-light me-2 ms-auto" href="select-clinic.html">Trocar clínica</a>
            <button class="btn btn-outline-light" id="logout-button">Sair</button>
        </div>
    </nav>

    <main class="container mt-5">
        <h1 class="mb-4">Bem-vindo, Paciente!</h1>

        <section class="content-section">
            <h2>Minhas Consultas Agendadas</h2>
            <table class="table">
                <thead>
                    <tr>
                        <th>Profissional</th>
                        <th>Período</th>
                        <th>Status</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="tabela-consultas-paciente">
                    <tr><td colspan="4" class="text-center">Carregando consultas...</td></tr>
                </tbody>
            </table>
        </section>

        <section class="content-section">
            <h2>Marcar Nova Consulta</h2>
            <form id="agendamento-form">
                <div class="mb-3">
                    <label for="profissional-select" class="form-label">Escolha o profissional:</label>
                    <select id="profissional-select" class="form-select" required>
                        <option selected disabled>Carregando profissionais...</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="inicio-consulta" class="form-label">Data e hora:</label>
                    <input type="datetime-local" id="inicio-consulta" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="duracao-consulta" class="form-label">Duração:</label>
                    <select id="duracao-consulta" class="form-select" required>
                        <option value="30">30 minutos</option>
                        <option value="45" selected>45 minutos</option>
                        <option value="60">60 minutos</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-calendar-plus"></i> Confirmar Agendamento
                </button>
                <div id="agendamento-status" class="mt-3"></div>
            </form>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/vitalis-client.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
