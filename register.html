<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro — Vitalis</title>
    <link rel="icon" type="image/png" href="img/icons8-blue-heart-96.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Estilo para centralizar o conteúdo da página */
        body, html { height: 100%; }
        .register-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
    </style>
</head>
<body class="bg-light">

    <div class="register-container">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <h2 class="h3"><i class="bi bi-heart-pulse-fill text-primary"></i> Vitalis</h2>
                        <p class="text-muted">Crie sua conta de paciente</p>
                    </div>

                    <form id="register-form">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome Completo:</label>
                            <input type="text" class="form-control" id="nome" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail:</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="senha" class="form-label">Senha:</label>
                            <input type="password" class="form-control" id="senha" minlength="12" required>
                            <div class="form-text">Use pelo menos 12 caracteres.</div>
                        </div>
                        <div class="mb-3">
                            <label for="clinica-slug" class="form-label">Código da clínica:</label>
                            <input type="text" class="form-control" id="clinica-slug" maxlength="100" required>
                            <div class="form-text">Solicite o código à clínica em que deseja se cadastrar.</div>
                        </div>
                        <div class="d-grid">
                           <button type="submit" class="btn btn-primary">Cadastrar</button>
                        </div>
                    </form>

                    <div id="status-message" class="mt-3 text-center"></div>
                    
                    <div class="text-center mt-3">
                        <p>Já tem uma conta? <a href="login.html">Faça o login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/vitalis-client.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
