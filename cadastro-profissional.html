<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cadastro profissional — Vitalis</title>
  <link rel="icon" type="image/png" href="img/icons8-blue-heart-96.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="bg-light">
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <section class="card shadow-sm w-100" style="max-width:720px">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4"><h1 class="h3"><i class="bi bi-heart-pulse-fill text-primary"></i> Vitalis Profissional</h1><p class="text-muted mb-0">Crie sua identidade profissional sem precisar de vínculo prévio com uma clínica.</p></div>
        <form id="professional-register-form" class="row g-3">
          <div class="col-12"><label class="form-label" for="professional-register-name">Nome completo</label><input class="form-control" id="professional-register-name" maxlength="160" autocomplete="name" required></div>
          <div class="col-md-6"><label class="form-label" for="professional-register-email">E-mail</label><input class="form-control" id="professional-register-email" type="email" maxlength="254" autocomplete="email" required></div>
          <div class="col-md-6"><label class="form-label" for="professional-register-password">Senha</label><input class="form-control" id="professional-register-password" type="password" minlength="12" maxlength="200" autocomplete="new-password" required><div class="form-text">Use pelo menos 12 caracteres.</div></div>
          <div class="col-12"><label class="form-label" for="professional-register-type">Tipo de profissional</label><input class="form-control" id="professional-register-type" maxlength="80" placeholder="Médico, psicólogo, fisioterapeuta..." required></div>
          <div class="col-sm-4"><label class="form-label" for="professional-register-council">Conselho</label><input class="form-control text-uppercase" id="professional-register-council" maxlength="30" placeholder="CRM" required></div>
          <div class="col-sm-5"><label class="form-label" for="professional-register-number">Registro</label><input class="form-control text-uppercase" id="professional-register-number" maxlength="40" required></div>
          <div class="col-sm-3"><label class="form-label" for="professional-register-state">UF</label><input class="form-control text-uppercase" id="professional-register-state" maxlength="2" pattern="[A-Za-z]{2}" required></div>
          <div class="col-12"><div class="alert alert-info small mb-0"><i class="bi bi-shield-check"></i> O registro será analisado por um operador autorizado. O consultório só poderá ser criado depois da verificação.</div></div>
          <div class="col-12 d-grid"><button class="btn btn-primary" type="submit">Criar conta profissional</button></div>
          <div id="professional-register-status" class="col-12" role="status" aria-live="polite"></div>
        </form>
        <div class="text-center mt-3"><a href="login.html">Já tenho uma conta</a></div>
      </div>
    </section>
  </main>
  <script src="js/vitalis-client.js"></script><script src="js/main.js"></script>
</body>
</html>
