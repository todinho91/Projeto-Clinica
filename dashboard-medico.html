<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel profissional — Vitalis</title>
    <link rel="icon" type="image/png" href="img/icons8-blue-heart-96.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="vitalis-dashboard-body vitalis-professional-page">

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-heart-pulse-fill"></i>
                Vitalis — <span data-clinic-name>Clínica</span>
            </a>
            <a class="btn btn-outline-light me-2 ms-auto" href="select-clinic.html">Trocar clínica</a>
            <a class="btn btn-outline-light me-2" href="disponibilidade.html">Disponibilidade</a>
            <button class="btn btn-outline-light" id="logout-button">Sair</button>
        </div>
    </nav>

    <main class="container py-4 py-md-5">
        <section class="vitalis-welcome">
            <div><p class="vitalis-eyebrow">Área profissional</p><h1>Painel profissional</h1><p>Consulte seus atendimentos e conclua somente as consultas sob sua responsabilidade.</p></div>
            <button class="btn vitalis-refresh-button" id="atualizar-agenda-medico" type="button"><i class="bi bi-arrow-clockwise"></i> Atualizar agenda</button>
        </section>

        <section class="vitalis-panel">
            <div class="vitalis-panel-header"><div><p class="vitalis-eyebrow">Clínica ativa</p><h2>Minha agenda</h2></div><span>Atualização automática a cada 30 segundos</span></div>
            <div class="table-responsive vitalis-appointment-table-wrap">
                <table class="table vitalis-agenda-table vitalis-appointment-table mb-0">
                    <thead>
                        <tr>
                            <th>Data e Hora</th>
                            <th>Paciente</th>
                            <th>Status</th>
                            <th>Ação</th>
                            </tr>
                    </thead>
                    <tbody id="tabela-agenda">
                        <tr><td colspan="4" class="text-center">Carregando agenda...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
        <div id="agenda-status" role="status" aria-live="polite"></div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/vitalis-client.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
