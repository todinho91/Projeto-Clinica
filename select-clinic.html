<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecionar clínica — Vitalis</title>
    <link rel="icon" type="image/png" href="img/icons8-blue-heart-96.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow-sm w-100" style="max-width: 520px;">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <h1 class="h3"><i class="bi bi-heart-pulse-fill text-primary"></i> Vitalis</h1>
                    <p class="text-muted mb-0">Selecione a clínica que deseja acessar.</p>
                </div>
                <form id="clinic-form">
                    <label for="clinica-select" class="form-label">Clínica e papel</label>
                    <select id="clinica-select" class="form-select" required>
                        <option>Carregando vínculos...</option>
                    </select>
                    <button type="submit" class="btn btn-primary w-100 mt-3">Continuar</button>
                </form>
                <div id="clinic-status" class="mt-3 text-center" role="alert"></div>
                <button id="logout-button" type="button" class="btn btn-link w-100 mt-2">Sair da conta</button>
            </div>
        </div>
    </main>
    <script src="js/vitalis-client.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
